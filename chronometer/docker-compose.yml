services:
  # The Chronometer app, built from the local Dockerfile (default `app` stage)
  app:
    build:
      context: .
      target: app

  # Postgres database; reachable from `app` at hostname `db`
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

# Named volume so Postgres data persists across `docker compose down` / `up`
volumes:
  pgdata:
