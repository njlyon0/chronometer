services:
  # The Chronometer app, built from the local Dockerfile (default `app` stage)
  app:
    build:
      context: .
      target: app
    # Same credentials as `db`; reach Postgres via its service name
    env_file: .env
    environment:
      DB_HOST: db
    # Run the Django development server
    command: ["python", "app/manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    # Live code: runserver reloads on save, no rebuild needed
    volumes:
      - ./app:/app/app
      - ./data:/data:ro
    # Wait until Postgres is accepting connections, not just started
    depends_on:
      db:
        condition: service_healthy

  # Postgres database; reachable from `app` at hostname `db`
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    # `$$` defers expansion to the container, where the .env values are set
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  test:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

# Named volume so Postgres data persists across `docker compose down` / `up`
volumes:
  pgdata:
