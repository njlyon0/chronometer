[project]
name = "chronometer"
version = "0.2.0"
description = "Toy app for practicing Tempo-related skills"
readme = "README.md"
authors = [
    { name = "njlyon0", email = "nicholasjlyon@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
chronometer = "chronometer:main"
chronometer-db-check = "chronometer.db_check:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
