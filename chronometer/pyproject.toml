[project]
name = "chronometer"
version = "0.1.0"
description = "Toy app for practicing Tempo-related skills"
readme = "README.md"
authors = [
    { name = "njlyon0", email = "nicholasjlyon@gmail.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
chronometer = "chronometer:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
