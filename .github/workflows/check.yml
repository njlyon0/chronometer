name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: chronometer
      POSTGRES_PASSWORD: chronometer
      POSTGRES_DB: chronometer
      DB_HOST: localhost
      SECRET_KEY: ci-only-not-secret
    defaults:
      run:
        working-directory: chronometer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python --version
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - run: uv run chronometer-db-check
      - run: uv run python app/manage.py migrate
      - run: uv run python app/manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chronometer
          POSTGRES_PASSWORD: chronometer
          POSTGRES_DB: chronometer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronometer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
